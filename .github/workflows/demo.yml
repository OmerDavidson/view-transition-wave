name: Demo

# Builds the library and publishes demo/ to GitHub Pages on every push to main.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Assemble the site
        # The demo imports ../dist/index.js and maps distortion-wave to ../node_modules, so the site
        # keeps the repo's layout. The root redirects to the demo.
        run: |
          mkdir -p _site/node_modules/distortion-wave
          cp -r demo dist _site/
          cp -r node_modules/distortion-wave/src _site/node_modules/distortion-wave/
          cp node_modules/distortion-wave/LICENSE* _site/node_modules/distortion-wave/ 2>/dev/null || true
          printf '<!doctype html><meta charset="utf-8"><meta http-equiv="refresh" content="0; url=demo/"><a href="demo/">view-transition-wave demo</a>\n' > _site/index.html
      - uses: actions/upload-pages-artifact@v3

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
