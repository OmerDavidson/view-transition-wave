<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>view-transition-wave</title>
  <script type="importmap">
    { "imports": { "distortion-wave/src/": "/node_modules/distortion-wave/src/" } }
  </script>
  <style>
    :root { color-scheme: light; font-family: system-ui, sans-serif; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; gap: 32px; background: #f4f5fb; color: #1d1f2b; transition: none; }
    body.dark { background: #13141c; color: #eceef7; }
    main { display: grid; gap: 24px; justify-items: center; }
    .card { width: 360px; padding: 24px; border-radius: 20px; background: #fff; box-shadow: 0 8px 30px #0001; display: grid; gap: 12px; }
    body.dark .card { background: #1f2130; }
    .card.done { background: #e9fff3; }
    button { font: inherit; padding: 10px 20px; border-radius: 999px; border: 0; background: #5b5bff; color: #fff; cursor: pointer; }
  </style>
</head>
<body>
  <main>
    <h1>view-transition-wave</h1>
    <button id="theme">Switch theme (whole page)</button>
    <div class="card" id="card">
      <strong id="card-title">Pay $24.00</strong>
      <span id="card-body">One element, scoped transition.</span>
      <button id="pay">Confirm</button>
    </div>
    <button id="ring">Ring from here</button>
  </main>
  <script type="module">
    import { waveTransition, prepareWaveTransition } from '/dist/index.js';
    const theme = document.querySelector('#theme');
    requestIdleCallback(() => prepareWaveTransition({ origin: theme }));
    theme.addEventListener('click', (event) => {
      window.lastWave = waveTransition(() => document.body.classList.toggle('dark'), { origin: event.currentTarget });
    });
    const card = document.querySelector('#card');
    document.querySelector('#pay').addEventListener('click', (event) => {
      window.lastWave = waveTransition(() => {
        card.classList.toggle('done');
        document.querySelector('#card-title').textContent = card.classList.contains('done') ? 'Paid ✓' : 'Pay $24.00';
      }, { scope: card, origin: event.currentTarget, palette: 'mint' });
    });
    document.querySelector('#ring').addEventListener('click', (event) => {
      window.lastWave = waveTransition(() => document.body.classList.toggle('dark'), { origin: event, shape: 'ring', palette: 'ember' });
    });
  </script>
</body>
</html>
